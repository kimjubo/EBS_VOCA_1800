        const VOCAB = {};
        for (const [day, list] of Object.entries(RAW_DATA)) {
            VOCAB[day] = list.map(([eng, kor]) => ({ eng, kor }));
        }

        const daySelect = document.getElementById('daySelect');
        const allOption = document.createElement('option');
        allOption.value = "ALL";
        allOption.textContent = "전체 (Day 01 ~ Day 60)";
        daySelect.appendChild(allOption);

        for (let i = 1; i <= 60; i++) {
            const dayKey = `Day ${String(i).padStart(2, '0')}`;
            const opt = document.createElement('option');
            opt.value = dayKey;
            opt.textContent = dayKey;
            daySelect.appendChild(opt);
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            const arr = [...array];
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [arr[currentIndex], arr[randomIndex]] = [arr[randomIndex], arr[currentIndex]];
            }
            return arr;
        }

        function generateWords() {
            const selectedDay = daySelect.value;
            const countVal = document.getElementById('countSelect').value;
            let pool = [];
            
            if (selectedDay === "ALL") {
                Object.values(VOCAB).forEach(words => pool.push(...words));
            } else {
                pool = VOCAB[selectedDay] || [];
            }

            if (pool.length === 0) {
                alert("해당 Day의 데이터가 준비되지 않았습니다.");
                return;
            }

            let shuffled = shuffle(pool);
            if (countVal !== "all") {
                shuffled = shuffled.slice(0, parseInt(countVal, 10));
            }
            renderGrid(shuffled);
        }

        function renderGrid(words) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            words.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.onclick = () => card.classList.toggle('show-kor');
                card.innerHTML = `<div class="num">#${index + 1}</div><div class="eng">${item.eng}</div><div class="kor">${item.kor}</div>`;
                grid.appendChild(card);
            });
        }

        function toggleAllMeanings(show) {
            const cards = document.querySelectorAll('.word-card');
            cards.forEach(card => {
                if (show) card.classList.add('show-kor');
                else card.classList.remove('show-kor');
            });
        }
    </script>
